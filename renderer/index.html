<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Lichess Widget</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2b2b2b; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  /* Kenarlarda 5px sürükleme dışı boşluk bırakıldı: kenardan tutunca taşımak yerine boyutlandırır */
  .header { position: absolute; top: 5px; left: 5px; right: 5px; height: 29px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2px 0 6px; background: #2b2b2b; -webkit-app-region: drag; user-select: none; }
  .title { color: #d9d9d9; font-size: 12px; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fb84f; flex: none; }
  .actions { display: flex; gap: 2px; -webkit-app-region: no-drag; flex: none; }
  button { width: 26px; height: 24px; border: none; border-radius: 5px; background: transparent;
    color: #bdbdbd; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  button svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  button:hover { background: #3d3d3d; color: #fff; }
  #closeBtn:hover { background: #e5484d; }
  #pinBtn.active { color: #7fb84f; background: #3a4a30; }
  #pinBtn.active svg { fill: currentColor; }
  #minBtn .ico-expand { display: none; }
  body.collapsed #minBtn .ico-min { display: none; }
  body.collapsed #minBtn .ico-expand { display: block; }
</style>
</head>
<body>
  <div class="header">
    <div class="title"><span class="dot"></span>Lichess</div>
    <div class="actions">
      <button id="pinBtn" title="Sabitle: her zaman üstte kalsın">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 14v7"/></svg>
      </button>
      <button id="minBtn" title="Küçült / büyüt">
        <svg class="ico-min" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        <svg class="ico-expand" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button id="openBtn" title="Lichess.org'u tarayıcıda aç">
        <svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
      </button>
      <button id="closeBtn" title="Gizle (Alt+C)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <script>
    const pin = document.getElementById('pinBtn');
    const setPin = (v) => {
      pin.classList.toggle('active', !!v);
      pin.title = v ? 'Sabitlendi: her zaman üstte (kaldırmak için tıkla)' : 'Sabitle: her zaman üstte kalsın';
    };
    const setCollapsed = (v) => document.body.classList.toggle('collapsed', !!v);
    window.widgetAPI.getPin().then(setPin);
    window.widgetAPI.onPinState(setPin);
    window.widgetAPI.getCollapsed().then(setCollapsed);
    window.widgetAPI.onCollapseState(setCollapsed);
    pin.onclick = () => window.widgetAPI.togglePin();
    document.getElementById('minBtn').onclick = () => window.widgetAPI.toggleCollapse();
    document.getElementById('openBtn').onclick = () => window.widgetAPI.openLichess();
    document.getElementById('closeBtn').onclick = () => window.widgetAPI.hide();
  </script>
</body>
</html>
