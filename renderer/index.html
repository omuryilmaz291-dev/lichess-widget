<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Lichess Widget</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2b2b2b; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  .header { height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 0 10px; background: #2b2b2b; -webkit-app-region: drag; user-select: none; }
  .title { color: #d9d9d9; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .title .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fb84f; }
  .actions { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  button { width: 26px; height: 24px; border: none; border-radius: 5px; background: transparent;
    color: #bdbdbd; font-size: 14px; cursor: pointer; }
  button:hover { background: #3d3d3d; color: #fff; }
  #closeBtn:hover { background: #e5484d; }
  #pinBtn.active { color: #7fb84f; }
</style>
</head>
<body>
  <div class="header">
    <div class="title"><span class="dot"></span>Lichess</div>
    <div class="actions">
      <button id="pinBtn" title="Her zaman üstte">📌</button>
      <button id="openBtn" title="Lichess.org'u tarayıcıda aç">↗</button>
      <button id="closeBtn" title="Gizle (Alt+C)">✕</button>
    </div>
  </div>
  <script>
    const pin = document.getElementById('pinBtn');
    const setPin = (v) => pin.classList.toggle('active', !!v);
    window.widgetAPI.getPin().then(setPin);
    window.widgetAPI.onPinState(setPin);
    pin.onclick = () => window.widgetAPI.togglePin();
    document.getElementById('openBtn').onclick = () => window.widgetAPI.openLichess();
    document.getElementById('closeBtn').onclick = () => window.widgetAPI.hide();
  </script>
</body>
</html>
