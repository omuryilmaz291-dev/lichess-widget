name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Release derlemesi (cargo build)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: exe'yi LichessWidget.exe olarak hazırla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri/target/release/lichess-widget.exe" "dist/LichessWidget.exe"

      - name: GitHub Release oluştur ve exe'yi yükle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LichessWidget.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
