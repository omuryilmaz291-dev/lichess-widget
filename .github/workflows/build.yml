name: Build exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - run: copy src-tauri\target\release\lichess-widget.exe LichessWidget.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: LichessWidget
          path: LichessWidget.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LichessWidget.exe
